name: Build Node 24 for Android ARM64 (Termux Patched)

on:
  workflow_dispatch:

jobs:
  build-node24:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 g++ make git curl zip \
            pkg-config libssl-dev zlib1g-dev \
            brotli libbrotli-dev libc-ares-dev \
            autoconf automake libtool

      - name: Download Android NDK (API 28)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          mv android-ndk-r26d $HOME/ndk

      - name: Clone Node 24 source
        run: |
          git clone https://github.com/nodejs/node --branch v24.x --depth 1 node24

      ##################################################################
      # ✔ Download only required Termux patches
      ##################################################################
      - name: Download Termux patches
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/termux/termux-packages termux-src

          cd termux-src
          git sparse-checkout set packages/nodejs

          mkdir -p ../termux_patches

          cp packages/nodejs/avoid-ficlone-ioctl.patch ../termux_patches/ || true
          cp packages/nodejs/common.gypi.patch ../termux_patches/ || true
          cp packages/nodejs/node.gyp.patch ../termux_patches/ || true
          cp packages/nodejs/src-getaddrinfo.patch ../termux_patches/ || true
          cp packages/nodejs/deps-v8-src-trap-handler-trap-handler.h.patch ../termux_patches/ || true
          cp packages/nodejs/tools-v8_gypfiles-toolchain.gypi.patch ../termux_patches/ || true
          cp packages/nodejs/tools-v8_gypfiles-v8.gyp.patch ../termux_patches/ || true

          echo "Final patch list:"
          ls -l ../termux_patches

      ##################################################################
      # ✔ Apply the 7 safe patches
      ##################################################################
      - name: Apply Termux patches
        working-directory: node24
        run: |
          set -euo pipefail
          for p in \
            ../termux_patches/avoid-ficlone-ioctl.patch \
            ../termux_patches/common.gypi.patch \
            ../termux_patches/node.gyp.patch \
            ../termux_patches/src-getaddrinfo.patch \
            ../termux_patches/deps-v8-src-trap-handler-trap-handler.h.patch \
            ../termux_patches/tools-v8_gypfiles-toolchain.gypi.patch \
            ../termux_patches/tools-v8_gypfiles-v8.gyp.patch
          do
            echo "Applying: $p"
            patch -p1 < "$p" || (echo "Patch failed: $p" && exit 1)
          done

      ##################################################################
      # ✔ Correct Android cross-compile configuration (Termux style)
      ##################################################################
      - name: Configure Node.js for Android ARM64
        working-directory: node24
        env:
          NDK: ${{ runner.home }}/ndk
        run: |
          set -euo pipefail

          export NDK="$HOME/ndk"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export SYSROOT="$TOOLCHAIN/sysroot"

          # Required so clang resolves to Android cross-compiler target
          export PATH="$TOOLCHAIN/bin:$PATH"

          # GYP-compatible compiler names
          export CC=clang
          export CXX=clang++
          export CC_host=clang
          export CXX_host=clang++

          export AR=llvm-ar
          export RANLIB=llvm-ranlib

          # Required for Android
          export CFLAGS="--sysroot=$SYSROOT"
          export CXXFLAGS="--sysroot=$SYSROOT"
          export LDFLAGS="--sysroot=$SYSROOT"

          ./configure \
            --prefix=/output \
            --dest-os=android \
            --dest-cpu=arm64 \
            --shared-zlib \
            --shared-brotli \
            --shared-cares \
            --shared-openssl \
            --openssl-use-def-ca-store \
            --without-snapshot

      ##################################################################
      # ✔ Build and install
      ##################################################################
      - name: Build Node 24
        working-directory: node24
        run: |
          set -euo pipefail
          make -j$(nproc)
          make install DESTDIR=/tmp/nodeandroid

      ##################################################################
      # ✔ Runtime sanity check
      ##################################################################
      - name: Verify node -v
        run: |
          set -euo pipefail
          if [ -x /tmp/nodeandroid/output/bin/node ]; then
            echo "Running built node:"
            LD_LIBRARY_PATH="/tmp/nodeandroid/output/lib" /tmp/nodeandroid/output/bin/node -v || true
          else
            echo "ERROR: Node binary missing!" >&2
            exit 1
          fi

      ##################################################################
      # ✔ Package artifact
      ##################################################################
      - name: Prepare Android bundle
        run: |
          mkdir -p final/usr/bin
          mkdir -p final/usr/lib

          cp /tmp/nodeandroid/output/bin/node final/usr/bin/ || true
          cp /tmp/nodeandroid/output/bin/npm final/usr/bin/ || true
          cp /tmp/nodeandroid/output/lib/*.so final/usr/lib/ || true

          cd final
          zip -r ../node24-full-android-arm64.zip usr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node24-full-android-arm64
          path: node24-full-android-arm64.zip
