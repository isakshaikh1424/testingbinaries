name: Build Node 24 for Android ARM64

on:
  workflow_dispatch:

jobs:
  build-node24:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 g++ make git curl zip \
            pkg-config libssl-dev zlib1g-dev \
            brotli libbrotli-dev libc-ares-dev

      - name: Download Android NDK (API 28)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          mv android-ndk-r26d $HOME/ndk

      - name: Clone Node 24 source
        run: |
          git clone https://github.com/nodejs/node --branch v24.x --depth 1 node24

      #######################################################################
      # FIXED PART — Correct Termux patch download using sparse checkout
      #######################################################################
      - name: Download Termux patches (Node 24)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/termux/termux-packages termux-src

          cd termux-src
          git sparse-checkout set packages/nodejs/patches

          mkdir ../termux_patches
          cp packages/nodejs/patches/*.patch ../termux_patches/
      #######################################################################

      - name: Apply Termux patches
        working-directory: node24
        run: |
          for patch in ../termux_patches/*.patch; do
            echo "Applying patch: $patch"
            patch -p1 < "$patch"
          done

      - name: Configure Node.js for Android ARM64 (API 28)
        working-directory: node24
        run: |
          export NDK=$HOME/ndk
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC="$TOOLCHAIN/bin/aarch64-linux-android28-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android28-clang++"
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

          ./configure \
            --prefix=/output \
            --dest-os=android \
            --dest-cpu=arm64 \
            --shared-zlib \
            --shared-brotli \
            --shared-cares \
            --shared-openssl \
            --openssl-use-def-ca-store \
            --without-snapshot \
            --no-create-symlinks \
            CC="$CC" CXX="$CXX"

      - name: Build Node 24
        working-directory: node24
        run: |
          make -j$(nproc)
          make install DESTDIR=/tmp/nodeandroid

      - name: Package Android-ready Node bundle
        run: |
          mkdir -p final/usr/bin
          mkdir -p final/usr/lib

          cp /tmp/nodeandroid/output/bin/node final/usr/bin/
          cp /tmp/nodeandroid/output/bin/npm final/usr/bin/ || true
          cp /tmp/nodeandroid/output/lib/*.so final/usr/lib/

          cd final
          zip -r node24-full-android-arm64.zip usr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node24-full-android-arm64
          path: final/node24-full-android-arm64.zip
