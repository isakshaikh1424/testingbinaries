name: Build Node24 Android ARM64

on:
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            python3 git curl unzip build-essential \
            clang llvm pkg-config \
            zlib1g-dev libssl-dev libbrotli-dev libc-ares-dev

      - name: Install Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          mv android-ndk-r26d $HOME/android-ndk

      - name: Clone Node 24
        run: |
          git clone https://github.com/nodejs/node --branch v24.x --depth 1 node24

      - name: Configure Node for Android ARM64
        working-directory: node24
        env:
          CC: $HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CXX: $HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          AR: $HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB: $HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: |
          ./configure \
            --prefix=/output \
            --dest-os=android \
            --dest-cpu=arm64 \
            --with-intl=none \
            --shared-cares \
            --shared-zlib \
            --shared-brotli \
            --shared-openssl \
            --openssl-use-def-ca-store \
            --no-create-symlinks \
            --without-node-options

      - name: Build Node
        working-directory: node24
        run: |
          make -j$(nproc)
          make install DESTDIR=/tmp/nodeandroid

      - name: Prepare final bundle
        run: |
          mkdir -p final/usr/bin
          mkdir -p final/usr/lib
          cp /tmp/nodeandroid/output/bin/node final/usr/bin/
          cp /tmp/nodeandroid/output/lib/*.so final/usr/lib/
          cd final
          zip -r node24-android-arm64.zip usr

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node24-android-arm64
          path: final/node24-android-arm64.zip
